name: Pages

# Läuft nur noch von Hand (Actions → Pages → Run workflow). Die Seite wird derzeit direkt aus dem Branch veröffentlicht ("pages build and deployment");
# der automatische Lauf bei jedem Push schlug am Deploy-Schritt fehl (Umgebungsregel von github-pages erlaubt main nicht).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html style.css src dist _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
