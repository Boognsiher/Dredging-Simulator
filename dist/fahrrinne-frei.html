<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Fahrrinne frei!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9A%A2%3C/text%3E%3C/svg%3E">
  <style>
:root { --bg:#0e1a24; --panel:#16273a; --ink:#e8eef4; --muted:#8fa6ba; --accent:#3fb0c9; --bad:#ff7a6b; --good:#7bd88f; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui, sans-serif; }
header { display:flex; flex-wrap:wrap; gap:8px 24px; align-items:center; justify-content:space-between; padding:10px 16px; background:var(--panel); }
h1 { font-size:18px; margin:0; } h2 { font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 8px; }
#hud, #shift-hud { display:flex; gap:16px; } #hud b, #shift-hud b { font-variant-numeric:tabular-nums; }
main { display:grid; grid-template-columns: minmax(0,1fr) 300px; gap:16px; padding:16px; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
#stage { position:relative; background:#0a1219; border-radius:8px; overflow:hidden; }
canvas { display:block; margin:0 auto; touch-action:none; }
#shift-hud { position:absolute; top:8px; left:8px; background:#000a; padding:4px 10px; border-radius:6px; }
#overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; background:#000b; padding:24px; }
#overlay.show { display:flex; } #overlay div { max-width:380px; }
#panel { background:var(--panel); border-radius:8px; padding:4px 16px 16px; }
button { font:inherit; color:var(--ink); background:#24415c; border:0; border-radius:6px; padding:8px 12px; cursor:pointer; }
button:hover:not(:disabled) { background:#2f5679; } button:disabled { opacity:.4; cursor:not-allowed; }
button.primary { background:var(--accent); color:#04222b; font-weight:600; width:100%; margin:12px 0 6px; } button#btn-wait { width:100%; }
.up { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; } .up small { color:var(--muted); display:block; }
#log { list-style:none; margin:0; padding:0; max-height:240px; overflow:auto; font-size:13px; } #log li { padding:2px 0; color:var(--muted); }
#log .good { color:var(--good); } #log .bad { color:var(--bad); }
#shift-actions { display:flex; flex-wrap:wrap; gap:8px; padding:0 8px 8px; } #shift-actions button { width:auto; margin:0; }
#shift-actions[hidden], #shift-hud[hidden] { display:none; }
#plant { font-size:13px; } #plant progress { width:100%; height:10px; } #plant label { display:flex; gap:6px; align-items:center; margin-top:6px; }
#upgrades h3 { font-size:13px; color:var(--muted); margin:12px 0 6px; font-weight:600; }
.warn { color:var(--bad); }
#toast { position:absolute; top:44px; left:8px; right:8px; text-align:center; pointer-events:none; }
#toast span { display:inline-block; background:#000c; padding:6px 12px; border-radius:6px; }
#toast .bad, #toast .clog { color:var(--bad); } #toast .good { color:var(--good); }
button#btn-drone, button#btn-wait { width:100%; margin-top:6px; }
#stage { position:sticky; top:8px; align-self:start; }
#toast .tip { color:var(--bad); }
#cut-box { display:flex; align-items:center; gap:6px; background:#000a; padding:4px 10px; border-radius:6px; } #cut-box input { width:120px; }
#hud small { color:var(--muted); } button#btn-pause { width:100%; margin-top:6px; }
#cut-box[hidden], #shift-actions button[hidden] { display:none; }

/* ---------- Touch & kleine Bildschirme ---------- */
button { touch-action: manipulation; }
#stage { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#touch-ui[hidden], #btn-pause2, #panel-handle { display: none; }
#touch-ui { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 20px; }
#stick { position: relative; width: 132px; height: 132px; border-radius: 50%; background: #ffffff12; border: 2px solid #ffffff30; touch-action: none; flex: none; }
#stick::before, #stick::after { content: ''; position: absolute; background: #ffffff22; }
#stick::before { left: 50%; top: 10px; bottom: 10px; width: 2px; transform: translateX(-1px); }
#stick::after { top: 50%; left: 10px; right: 10px; height: 2px; transform: translateY(-1px); }
#knob { position: absolute; left: 38px; top: 38px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); opacity: .9; pointer-events: none; }
#act { width: 160px; height: 100px; border-radius: 50px; font-size: 19px; margin: 0; touch-action: none; }
#act.held { background: #7fe3ff; box-shadow: 0 0 0 6px #7fe3ff55; }
body.touch #btn-pause2 { display: block; position: absolute; top: 8px; right: 8px; z-index: 5; width: 48px; height: 48px; padding: 0; font-size: 20px; border-radius: 50%; }
body.touch button { min-height: 44px; }
body.touch #shift-actions button { padding: 10px 14px; }

@media (max-width: 860px) {
  body { padding-bottom: 56px; }
  main { padding: 8px; gap: 8px; }
  header { padding: 8px 12px; }
  #stage { position: relative; top: auto; }
  header h1 { font-size: 15px; }
  #hud { gap: 2px 12px; font-size: 13px; flex-wrap: wrap; }
  #hud span { white-space: nowrap; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 74vh; overflow: auto; border-radius: 14px 14px 0 0;
           box-shadow: 0 -6px 24px #000a; transform: translateY(calc(100% - 52px)); transition: transform .2s ease; padding-top: 0; }
  #panel.open { transform: none; }
  #panel-handle { display: block; position: sticky; top: 0; width: 100%; min-height: 52px; margin: 0; border-radius: 14px 14px 0 0; background: #1d3650; font-weight: 600; z-index: 1; }
  /* HUD und Aktionsknöpfe unter dem Spielfeld statt darüber, damit der Ponton frei bleibt */
  #shift-hud { position: static; display: flex; flex-wrap: wrap; gap: 4px 12px; background: none; padding: 6px 4px 0; font-size: 13px; border-radius: 0; }
  #shift-hud[hidden], #shift-actions[hidden] { display: none; }
  #shift-actions { margin: 6px 0 0; padding: 0; }
  #toast { top: 8px; right: 64px; }
  body.touch #btn-pause2 { width: 44px; height: 44px; }
}
/* Steuerung als Overlay: schwebt über dem unteren Bildschirmrand (über dem Panel-Griff), das Spielfeld bleibt oben sichtbar */
@media (max-width: 860px) {
  #touch-ui { position: fixed; left: 0; right: 0; bottom: 56px; z-index: 15; padding: 0 12px; pointer-events: none; }
  #touch-ui > * { pointer-events: auto; opacity: .82; }
  body { padding-bottom: 260px; }
}
@media (max-width: 860px) and (max-height: 720px) {
  #touch-ui { padding: 6px 16px; }
  #stick { width: 108px; height: 108px; } #knob { left: 26px; top: 26px; width: 56px; height: 56px; }
  #act { height: 84px; }
}
@media (max-width: 860px) and (orientation: landscape) and (max-height: 560px) {
  #touch-ui { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 14px; pointer-events: none; }
  #touch-ui > * { pointer-events: auto; opacity: .85; }
  #stick { width: 112px; height: 112px; } #knob { left: 28px; top: 28px; }
  #act { width: 130px; height: 84px; }
  body.touch #shift-actions { position: absolute; top: 8px; left: 8px; right: 64px; bottom: auto; margin: 0; }
  #shift-hud { position: absolute; top: auto; bottom: 8px; left: 50%; transform: translateX(-50%); background: #000a; border-radius: 6px; padding: 4px 10px; }
}

/* Overlays (Intro, Spielende) als Vollbild-Dialog: scrollbar, Knopf bleibt erreichbar */
#overlay { position: fixed; inset: 0; z-index: 30; overflow-y: auto; align-items: flex-start; padding: 16px; background: #000d; }
#overlay > div { margin: auto; max-width: 460px; }
#overlay .primary { position: sticky; bottom: 8px; width: 100%; }
#overlay details { text-align: left; margin: 8px 0; font-size: 14px; background: #ffffff0d; border-radius: 8px; padding: 6px 12px; }
#overlay summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
#overlay details p { margin: 6px 0; }
@media (max-width: 860px) { #shift-hud progress { width: 80px; } }

/* Pfeil-Knöpfe für die Pumpe (Handy, Querschnitt) und Tempo-Regler */
#dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 6px; flex: none; }
#dpad[hidden] { display: none; }
#dpad .dp { margin: 0; padding: 0; font-size: 22px; border-radius: 14px; background: #24415c; touch-action: none; min-height: 0; }
#dpad .dp:active, #dpad .dp.held { background: var(--accent); color: #04222b; }
#dpad .up { grid-column: 2; grid-row: 1; } #dpad .left { grid-column: 1; grid-row: 2; }
#dpad .right { grid-column: 3; grid-row: 2; } #dpad .down { grid-column: 2; grid-row: 3; }
#spd-box, #cut-box { display: flex; align-items: center; gap: 6px; background: #000a; padding: 4px 10px; border-radius: 6px; }
#spd-box input { width: 110px; }
#spd-box[hidden] { display: none; }
@media (max-width: 860px) and (orientation: landscape) and (max-height: 560px) { #dpad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 4px; } }
#dpad .dp { font-size: 30px; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center; }
#btn-pump.on { background: var(--accent); color: #04222b; font-weight: 600; }
#btn-pump[hidden] { display: none; }
#act.held { background: #7fe3ff; box-shadow: 0 0 0 6px #7fe3ff55; }

/* Steuerungsanzeige */
#hints { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 8px 10px; font-size: 13px; color: var(--muted); }
#hints kbd { display: inline-block; background: #24415c; color: var(--ink); border: 1px solid #ffffff22; border-radius: 5px; padding: 1px 7px; margin-right: 5px; font: inherit; font-size: 12px; font-weight: 600; }
@media (max-width: 860px) { #hints { font-size: 12px; padding: 6px 4px 0; gap: 2px 12px; } }
/* grosse Bildschirme: Panel und Schrift etwas grösser */
@media (min-width: 1500px) { main { grid-template-columns: minmax(0, 1fr) 380px; } body { font-size: 16px; } #hints { font-size: 14px; } }
body.touch #btn-anchor { display: none; } /* auf dem Handy wirft der grosse Knopf den Anker */

/* Handy quer: Aktionsknöpfe als schmale Spalte links, Regler oben rechts, Tastenhinweise aus: das Bild bleibt frei */
@media (max-width: 860px) and (orientation: landscape) and (max-height: 560px) {
  #hints { display: none; }
  body.touch #shift-actions { left: auto; right: 64px; width: auto; align-items: flex-end; flex-direction: column; flex-wrap: nowrap; gap: 4px; }
  body.touch #shift-actions button { padding: 2px 10px; min-height: 0; height: 28px; font-size: 12px; white-space: nowrap; }
  body.touch #spd-box, body.touch #cut-box { position: fixed; top: 80px; left: 16px; z-index: 5; }
  body.touch #cut-box { top: 118px; }
  #touch-ui { bottom: 4px; }
}

/* Handy hochkant: feste Aufteilung ohne Scrollen. Oben das Spiel (mit HUD im Bild), darunter die Bedienung,
   alles Weitere steckt im eingeklappten Panel am unteren Rand. */
@media (max-width: 860px) and (orientation: portrait) {
  html, body { height: 100dvh; overflow: hidden; }
  body { display: flex; flex-direction: column; padding-bottom: 0; }
  header { padding: 6px 12px; flex: none; }
  header h1 { display: none; }
  #hud { font-size: 12px; gap: 2px 10px; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 8px 0; gap: 0; }
  #stage { flex: 1; min-height: 0; min-width: 0; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
  #stage > canvas { flex: none; }
  #hints { display: none; }
  #shift-hud { position: absolute; top: 4px; left: 4px; right: 56px; background: #000a; border-radius: 6px; padding: 2px 8px; font-size: 11px; gap: 2px 10px; z-index: 2; }
  #shift-hud progress { width: 52px; }
  #shift-actions { flex: none; gap: 6px; margin: 6px 0 0; }
  #shift-actions button { padding: 6px 8px; font-size: 12px; flex: 1 1 28%; width: auto; min-height: 40px; line-height: 1.2; }
  #spd-box, #cut-box { flex: 1 1 100%; }
  #touch-ui { position: static; flex: none; margin-top: auto; padding: 8px 4px 64px; gap: 12px; }
  #touch-ui > * { opacity: 1; }
}
@media (max-width: 860px) and (orientation: portrait) and (max-height: 720px) {
  #dpad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 4px; }
  #touch-ui { padding-bottom: 58px; }
  #act { height: 80px; }
}

/* Rückbau-Knopf neben dem Kaufen-Knopf */
.upbtns { display: flex; gap: 6px; align-items: stretch; }
.upbtns button { margin: 0; }
.upbtns .sell { background: #3a2f2f; font-size: 14px; white-space: nowrap; min-width: 40px; padding: 6px 8px; }
.upbtns .sell:disabled { opacity: .35; }
.up > div:first-child { flex: 1 1 auto; min-width: 0; }
.upbtns { flex: none; }

/* Hochformat: Tempo- und Abtragsregler teilen sich eine Zeile, die Knöpfe laufen einzeilig (seitlich wischbar), damit die Steuerung unten nie abgeschnitten wird */
@media (max-width: 860px) and (orientation: portrait) {
  #shift-actions { flex-wrap: wrap; }
  #shift-actions button { flex: 1 0 auto; white-space: nowrap; min-height: 36px; }
  #spd-box, #cut-box { flex: 1 1 45%; min-width: 0; padding: 2px 8px; font-size: 12px; }
  #spd-box input, #cut-box input { width: 100%; min-width: 50px; flex: 1; }
  #spd-box small, #cut-box small { display: none; }
}

/* Zeilenwahl des Kastens */
#row-box-unused { display: flex; align-items: center; gap: 4px; background: #000a; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
#row-box-unused:empty { display: none; }
.rowchip { margin: 0; padding: 0; width: 38px; height: 34px; border-radius: 8px; font-weight: 700; color: var(--ink);
  background: linear-gradient(to top, #3a6a4a var(--p, 0%), #24415c var(--p, 0%)); border: 2px solid transparent; }
.rowchip.on { border-color: #7fe3ff; box-shadow: 0 0 0 2px #7fe3ff55; }
.rowchip.done { background: #2f7a48; }
.rowchip.deep { background: linear-gradient(to top, #8a5a2a var(--p, 0%), #24415c var(--p, 0%)); }
@media (max-width: 860px) and (orientation: portrait) { #row-box-unused { flex: 1 1 100%; justify-content: center; } .rowchip { flex: 1; max-width: 56px; height: 40px; } }
@media (max-width: 860px) and (orientation: portrait) and (max-height: 720px) { .rowchip { height: 32px; } #shift-actions button { min-height: 32px; } }

/* Levelauswahl */
h1 small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.levels { display: flex; flex-direction: column; gap: 10px; margin: 10px 0; }
button.level { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; margin: 0; padding: 12px; border-radius: 12px; }
button.level small { display: block; color: var(--muted); font-weight: 400; margin-top: 4px; font-size: 13px; }
button.level .swatch { flex: none; width: 34px; height: 34px; border-radius: 8px; border: 2px solid #ffffff55; margin-top: 2px; }
button.level.locked { opacity: .5; }

/* Lesbarkeit: etwas grössere Schrift, Meldungen gut sichtbar */
#toast { z-index: 6; }
#toast span { font-size: 15px; padding: 8px 14px; box-shadow: 0 2px 10px #000a; max-width: 100%; }
#shift-hud { font-size: 14px; }
#hints { font-size: 14px; }
#hud { font-size: 14px; }
#shift-actions button { font-size: 14px; }
@media (max-width: 860px) {
  #hud { font-size: 13px; }
  #shift-hud { font-size: 13px; }
  #toast span { font-size: 16px; }
  #panel { font-size: 15px; }
  .up small, .claim small, #claims, #plant { font-size: 14px; }
}
@media (max-width: 860px) and (orientation: portrait) {
  #shift-hud { font-size: 12px; }
  #shift-actions button { font-size: 13px; }
  #spd-box, #cut-box { font-size: 13px; }
}
#row-box-unused[hidden] { display: none; }

/* Hochformat: doppelte Knöpfe entfallen (die Pumpe schaltet der grosse Knopf, Ton steht im Panel); die Knopfzeilen scrollen notfalls,
   statt die Pfeile unten aus dem Bild zu drängen */
@media (max-width: 860px) and (orientation: portrait) {
  body.touch #btn-pump, body.touch #btn-sound { display: none; }
  #shift-actions { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
  #touch-ui { flex: none; }
}
#h-buf.warn { color: var(--bad); }
button#btn-sound2 { width: 100%; margin-top: 6px; }

/* Bauleiter Bruno (Tipps, Spiel pausiert) */
#bruno { position: fixed; inset: 0; z-index: 26; display: flex; align-items: flex-end; justify-content: center; padding: 0 10px 72px; background: #0006; }
#bruno[hidden] { display: none; }
.bruno-row { display: flex; gap: 10px; align-items: flex-end; max-width: 560px; width: 100%; animation: brunoIn .25s ease-out; }
.bruno-head { flex: none; text-align: center; animation: brunoBob 2.4s ease-in-out infinite; }
.bruno-head small { display: block; color: #ffd84d; font-weight: 700; font-size: 11px; margin-top: -4px; }
.bruno-bubble { position: relative; flex: 1; background: #fffbe8; color: #2c2415; border: 2px solid #b58900; border-radius: 16px; padding: 12px 14px; box-shadow: 0 6px 20px #000a; }
.bruno-bubble::before { content: ''; position: absolute; left: -12px; bottom: 28px; border: 8px solid transparent; border-right: 12px solid #b58900; border-left: 0; }
.bruno-bubble::after { content: ''; position: absolute; left: -8px; bottom: 30px; border: 6px solid transparent; border-right: 10px solid #fffbe8; border-left: 0; }
.bruno-bubble p { margin: 0 0 10px; font-size: 16px; line-height: 1.4; }
.bruno-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.bruno-btns button { margin: 0; flex: 1 1 auto; }
.bruno-links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; }
.bruno-links button { background: none; border: 0; color: #6f5d33; text-decoration: underline; padding: 4px 0; font-size: 13px; min-height: 0; width: auto; margin: 0; }
@keyframes brunoIn { from { transform: translateY(20px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes brunoBob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
@media (max-width: 860px) { .bruno-bubble p { font-size: 15px; } }

#touch-ui #act { margin-left: auto; }

/* Geld-Änderung kurz in der Kopfzeile (ersetzt die Einkommensangabe) */
#h-income.delta { font-weight: 800; font-size: 1.05em; }
#h-income.delta.plus { color: var(--good); }
#h-income.delta.minus { color: var(--bad); }
/* Meldung: klein, ein Chip, nie über 2 Zeilen */
#toast span { font-size: 14px !important; padding: 5px 12px !important; }
body.touch #btn-pause2 { opacity: .8; }
canvas { transition: none; }

/* ---------- Fahrrinne frei: neue Bereiche ---------- */
:root { --bg:#0b1a26; --panel:#142a3d; --accent:#4fc3d9; }
#classbar { display: flex; gap: 6px; padding: 6px 4px; overflow-x: auto; scrollbar-width: thin; }
.cls { flex: 1 1 0; min-width: 118px; margin: 0; padding: 6px 8px; text-align: left; border: 2px solid transparent; border-radius: 10px; background: #1b3550; line-height: 1.25; }
.cls b { display: block; font-size: 13px; white-space: nowrap; }
.cls small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.cls.ok { background: #1f4a37; } .cls.ok small { color: #a9e9bd; }
.cls.on { border-color: #7fe3ff; box-shadow: 0 0 0 2px #7fe3ff55; }
.cls .wait { float: right; background: #ffd24d; color: #3b2f08; border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 700; }
.cls .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
#goal progress, #fairway progress { width: 100%; height: 10px; }
#goal { font-size: 13px; } #goal button { margin-top: 8px; width: 100%; }
.frow { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 13px; padding: 3px 0; border-bottom: 1px solid #ffffff10; }
.frow small { color: var(--muted); } .frow .ok { color: var(--good); } .frow .no { color: #ffb4a8; }
.mrow { display: grid; grid-template-columns: 1fr auto 56px; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; }
.mrow svg { width: 56px; height: 18px; display: block; }
.tr-up { color: var(--good); } .tr-down { color: var(--bad); }
.contract { background: #ffffff0d; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
.contract b { display: block; } .contract small { color: var(--muted); display: block; }
.contract progress { width: 100%; height: 8px; margin-top: 4px; }
.contract button { margin-top: 6px; width: 100%; }
#contracts .empty { color: var(--muted); font-size: 13px; }
#p-mats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 8px 0; font-size: 11.5px; text-align: center; }
#p-mats div { background: #ffffff0d; border-radius: 6px; padding: 3px 2px; }
#p-mats i { display: block; height: 4px; border-radius: 2px; margin-bottom: 3px; }
@media (max-width: 860px) { #classbar { padding: 4px 0; gap: 4px; } .cls { min-width: 104px; padding: 4px 6px; } }
@media (max-width: 860px) and (orientation: landscape) and (max-height: 560px) { #classbar { display: none; } }
#bruno-name { color: #ffd84d; }
/* HUD des Querschnitts liegt unter dem Bild (nicht über der Klassenleiste) */

// ---------- Hauptschleife ----------
let last = performance.now(), panelTimer = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ui.dt = dt; ui.t += dt;
  if (readInput.tap('KeyP')) togglePause();
  if (readInput.tap('KeyB') && !overlayOpen()) setFritz(!advisor.enabled);
  const running = !paused && !sheetOpen && !overlayOpen() && !tipOpen && game.status === 'playing';
  touch?.setMode(sim.mode);

  if (!running) audio.hum(false, 0);
  if (readInput.tap('KeyM')) toggleSound();
  if (running) {
    saveClock += dt;
    if (game.day !== savedDay || saveClock > 10) saveGame();
    const inMap = sim.mode === 'map';
    const cur = inMap ? { x: OX + sim.x * CELL, y: sim.y * CELL } : sliceHeadScreen(sim.slice);
    const inp = readInput.read(cur, { holdToMove: true });
    for (let k = 0; k < game.level.classes.length; k++) if (readInput.tap(`Digit${k + 1}`, `Numpad${k + 1}`)) chooseClass(game.level.classes[k]);
    if (inMap) {
      inp.suction = false;
      if (mapTarget) {
        if (Math.abs(inp.dx) + Math.abs(inp.dy) > 0.1) mapTarget = null;
        else {
          const st = steerToward(sim, mapTarget);
          if (st.arrived) { mapTarget = null; anchor(); } else { inp.dx = st.dx; inp.dy = st.dy; }
        }
      }
      if (readInput.tap('Space', 'Enter', 'KeyE')) anchor();
    } else {
      if (readInput.tap('Escape', 'KeyQ')) leave();
      if (readInput.tap('KeyT')) toggleAuto();
      if (readInput.tap('KeyR')) fixAuto();
      if (readInput.tap('Space')) togglePump();
      inp.suction = sim.pumpOn;
      if (readInput.tap('KeyZ')) setSpeed(sim.pumpSpeed - 0.1);
      if (readInput.tap('KeyX')) setSpeed(sim.pumpSpeed + 0.1);
      if (readInput.tap('KeyF')) setDepthValue(sim.targetDepth - 0.1);
      if (readInput.tap('KeyG')) setDepthValue(sim.targetDepth + 0.1);
    }
    game.site = sim.mode === 'slice' ? { x: sim.x, y: sim.y } : null;
    sim.bufferRoom = game.bufferRoom;
    const before = game.money, d = sim.update(dt, inp);
    game.collect(d);
    advisor.observe(dt, d, game, sim);
    for (const n of sim.notes.splice(0)) {
      toast(n.text, n.kind);
      if (sim.mode === 'slice' && (n.kind === 'clog' || n.kind === 'tip')) {
        const m = sliceMouthScreen(sim.slice);
        fx.burst(m.x, m.y, n.kind === 'tip' ? 40 : 18, n.kind === 'tip' ? 'dust' : 'hard');
        audio[n.kind]();
        try { navigator.vibrate?.(n.kind === 'tip' ? [80, 40, 120] : 40); } catch { /* egal */ }
      }
    }
    if (sim.mode === 'slice') {
      const sl = sim.slice, m = sliceMouthScreen(sl), load = Math.min(1, d.removed / Math.max(1e-6, sim.stats.power * dt));
      fx.feed(m, sliceY(sl.surfaceAt(sl.mouth().x), game.wl), d, dt, Math.max(0, game.money - before));
      audio.hum(sim.pumpOn && sl.suctioning, load);
      $('btn-auto').hidden = sim.stats.autoLevel <= 0;
      $('btn-auto').textContent = sl.auto.on ? '🤖 Automatik aus (T)' : '🤖 Automatik an (T)';
      $('btn-fix').hidden = !sl.auto.error;
      $('btn-pump').textContent = sl.freeing ? '🔧 Freispülen! (Leertaste)' : sim.pumpOn ? '🌀 Pumpe: AN (Leertaste)' : '🌀 Pumpe: AUS (Leertaste)';
      $('btn-pump').classList.toggle('on', sim.pumpOn);
      touch?.setPump(sim.pumpOn, !!sl.freeing);
      $('spd-box').hidden = false;
      if (document.activeElement !== $('spd')) { $('spd').value = sim.pumpSpeed; $('spd-val').textContent = pct(sim.pumpSpeed); }
      $('cut-box').hidden = false;
      if (document.activeElement !== $('cut')) { $('cut').value = sim.targetDepth; $('cut-val').textContent = `${sim.targetDepth.toFixed(1)} m`; }
    }
    $('s-removed').textContent = sim.mode === 'slice'
      ? `${game.totals.removed.toFixed(0)} m³ gebaggert · ${sim.slice.restCount()} Zellen über Solltiefe${sim.bufferFull ? ' · Puffer voll, Pumpe pausiert!' : ''}`
      : `${game.traffic.ships.filter((s) => s.state === 'sail').length} Schiffe unterwegs · ${game.traffic.ships.filter((s) => s.state === 'queue').length} wartend`;
    $('s-turb').value = sim.turbidity;
    $('s-tilt').value = sim.mode === 'slice' ? sim.slice.tilt : 0;
    fx.update(dt);
    game.update(dt);
    for (const f of game.flash.splice(0)) ui.floaters.push({ ...f, life: 1.6 });
    for (const f of ui.floaters) f.life -= dt;
    ui.floaters = ui.floaters.filter((f) => f.life > 0);
    tipTimer += dt;
    if (tipTimer > 1) {
      tipTimer = 0;
      if (advisor.enabled && !(sim.mode === 'slice' && (sim.slice.freeing || sim.slice.tipped > 0))) { const tip = advisor.pick(game, sim); if (tip) showTip(tip); }
    }
    for (const n of game.notes.splice(0)) toast(n.text, n.kind);
  }
  readInput.endFrame();

  trackMoney(dt);
  stateSigTimer += dt;
  if (stateSigTimer > 0.5) {
    stateSigTimer = 0;
    const sig = gameSig();
    if (sig !== stateSig) { if (stateSig !== null) saveGame(); stateSig = sig; }
  }
  panelTimer += dt;
  if (panelTimer > 0.25) { panelTimer = 0; updatePanel(); }
  updateHud();
  if (game.status === 'ended' && !endShown) { updatePanel(); showEnd(); }

  if (sim.mode !== 'map') mapTarget = null;
  ui.mapTarget = mapTarget;
  ctx.setTransform(canvas.q || 1, 0, 0, canvas.q || 1, 0, 0);
  if (sim.mode === 'slice') {
    const o = fx.offset();
    ctx.save(); ctx.translate(o.x, o.y); drawSlice(ctx, game, sim, ui); fx.draw(ctx); ctx.restore();
  } else drawMap(ctx, game, sim, ui);
  panCanvas(1 / 60);
  requestAnimationFrame(frame);
}

function showIntro() {

    Erreichst du das <b>Verkehrsziel</b> (Tonnen Fracht) und hast am Ende Gewinn, schaltest du das nächste Fluss frei. Gewonnen hat, wer am Ende am meisten Geld hat.</p>

    <details ${isTouch ? '' : 'open'}><summary>Steuerung am Computer</summary>
      <p>Karte: WASD / Pfeile (oder Maus gedrückt) fahren, <b>E</b> / Leertaste wirft den Anker, <b>1–5</b> wählen die Schiffsklasse. Querschnitt: A/D fährt die Pumpe quer zum Fluss, W/S zieht sie hoch oder lässt sie runter, <b>Leertaste</b> schaltet die Pumpe ein und aus (saugt nach rechts und im Stillstand, rückwärts nie), <b>1–5</b> setzen die Solltiefe für eine Klasse, <b>F/G</b> ändern sie, <b>Z/X</b> Tempo, <b>T</b> Automatik, <b>R</b> Reset, <b>Q</b> zurück zur Karte, <b>P</b> Pause.</p></details>

const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

const mapPx = (cx, cy) => ({ x: OX + cx * CELL, y: cy * CELL });
const sliceY = (h, wl) => SURF + (wl - h) * PPM;

// ---------- Karte ----------
function cellColor(river, i, pal) {
  const top = river.top[i], depth = river.wl - top;
  if (depth <= 0.02) { // Land
    const e = Math.min(1, (top - river.wl) / 5);
    return mix(pal.land, [150, 140, 110], e * 0.8);
  }
  const t = Math.min(1, depth / 5);
  return mix([150, 205, 215], pal.water.map((v) => v * 0.55), Math.sqrt(t));
}

function drawMap(ctx, game, sim, ui = {}) {
  const r = game.river, pal = game.level.palette, { cols, rows } = r;
  ctx.fillStyle = rgb(pal.land); ctx.fillRect(0, 0, W, H);
  for (let y = 0; y < rows; y++) {
    for (let x = -MARGIN; x < cols + MARGIN; x++) {
      const cx = Math.min(cols - 1, Math.max(0, x)), i = y * cols + cx;
      ctx.fillStyle = rgb(cellColor(r, i, pal));
      ctx.fillRect(OX + x * CELL, y * CELL, CELL + 0.5, CELL + 0.5);
    }
  }
  // Baggerkorridor: ausserhalb (Ufer und Flachwasser) liegt die Naturschutzzone
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      if (r.isWater(i) && !r.zone[i]) { ctx.fillStyle = 'rgba(120,200,120,.22)'; ctx.fillRect(OX + x * CELL, y * CELL, CELL, CELL); }
    }
  }
  // Materialhinweise: Altlasten orange, Fels grau, harte Schichten schraffiert, Fremdstoffe weiss
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      if (!r.isWater(i)) continue;
      const px = OX + x * CELL, py = y * CELL;
      if (r.kind[i] === KIND.altlast && r.top[i] - r.rock[i] > 0.05) { ctx.fillStyle = 'rgba(255,120,40,.5)'; ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2); }
      if (r.top[i] - r.rock[i] < 0.05) { ctx.fillStyle = 'rgba(90,95,105,.55)'; ctx.fillRect(px, py, CELL, CELL); }
      if (r.hard[i] && r.top[i] - r.rock[i] > 0.05) {
        ctx.strokeStyle = 'rgba(10,20,30,.45)'; ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(px, py + CELL); ctx.lineTo(px + CELL, py);
        if (r.hard[i] > 1) { ctx.moveTo(px, py); ctx.lineTo(px + CELL, py + CELL); }
        ctx.stroke();
      }
      if (r.debris[i]) { ctx.fillStyle = '#f2f2f2'; ctx.fillRect(px + 5, py + 5, 6, 6); ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.strokeRect(px + 5.5, py + 5.5, 5, 5); }
    }
  }
  // Auswahl einer Schiffsklasse: wo fehlt Tiefe, wo läuft die günstigste Rinne
  const sel = ui.classSel && game.fair?.[ui.classSel] ? shipById(ui.classSel) : null;
  if (sel) drawClassOverlay(ctx, game, sel);
  drawShips(ctx, game, ui);
  if (sim) drawPontoon(ctx, game, sim, ui);
  // schwebende Beträge
  ctx.font = font(15); ctx.textAlign = 'center';
  for (const f of ui.floaters ?? []) {
    ctx.globalAlpha = Math.min(1, f.life / 0.6);
    const p = mapPx(f.x, f.y - (1.6 - f.life) * 1.2);
    ctx.fillStyle = '#000a'; ctx.fillText(f.text, p.x + 1, p.y + 1); ctx.fillStyle = f.color; ctx.fillText(f.text, p.x, p.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'start';
  drawMapHud(ctx, game);
  if (sim) turbidityVeil(ctx, sim);
}

function drawClassOverlay(ctx, game, cls) {
  const r = game.river, f = game.fair[cls.id], needTop = game.wl - needDepth(cls);
  const lo = Math.floor((cls.beam - 1) / 2), hi = cls.beam - 1 - lo, lane = new Set();
  for (const p of f.nodes ?? []) for (let k = p.y - lo; k <= p.y + hi; k++) lane.add(k * r.cols + p.x);
  for (let y = 0; y < r.rows; y++) {
    for (let x = 0; x < r.cols; x++) {
      const i = y * r.cols + x;
      if (!r.zone[i]) continue;
      const miss = r.top[i] - needTop;
      if (miss <= 0.02) continue;
      const strong = lane.has(i), a = strong ? Math.min(0.7, 0.3 + miss * 0.3) : 0.08; // die günstigste Rinne kräftig, der Rest nur angedeutet
      ctx.fillStyle = r.rock[i] > needTop ? `rgba(150,90,200,${a})` : `rgba(255,70,60,${a})`; // lila = Fels im Weg
      ctx.fillRect(OX + x * CELL, y * CELL, CELL, CELL);
    }
  }
  if (f.path) {
    const pts = f.path.points;
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = f.passable ? 'rgba(120,255,160,.30)' : 'rgba(255,255,255,.22)'; ctx.lineWidth = cls.beam * CELL * 0.9;
    ctx.beginPath(); pts.forEach((p, k) => (k ? ctx.lineTo(OX + p.x * CELL, p.y * CELL) : ctx.moveTo(OX + p.x * CELL, p.y * CELL))); ctx.stroke();
    ctx.strokeStyle = f.passable ? '#7bf0a0' : '#ffffff'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    ctx.stroke(); ctx.restore();
    if (f.weakest) { // engste Stelle
      const p = mapPx(f.weakest.x + 0.5, f.path.points.find((q) => Math.floor(q.x) === f.weakest.x)?.y ?? r.rows / 2);
      ctx.fillStyle = '#ffd24d'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p.x, p.y - 4); ctx.lineTo(p.x - 7, p.y - 18); ctx.lineTo(p.x + 7, p.y - 18); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
}

function drawShips(ctx, game, ui) {
  const ships = game.traffic.ships;
  const ranks = { 1: 0, '-1': 0 };
  const queue = ships.filter((s) => s.state === 'queue').sort((a, b) => b.wait - a.wait);
  const counts = { 1: 0, '-1': 0 };
  for (const s of ships) {
    const cls = shipById(s.cls);
    let p;
    if (s.state === 'queue') { const rank = ranks[s.dir]++; p = queuePos(game, s, rank); counts[s.dir]++; } else p = shipPos(s);
    if (!p) continue;
    drawShip(ctx, cls, s, p, game, ui);
  }
  if (queue.length) { // Anzahl Wartende an den Enden
    ctx.font = font(13); ctx.textAlign = 'center';
    for (const dir of [1, -1]) {
      if (!counts[dir]) continue;
      const first = queue.find((s) => s.dir === dir), p = queuePos(game, first, 0), q = mapPx(p.x, p.y);
      const w = first.wait / CONFIG.traffic.patience;
      ctx.fillStyle = '#000b'; ctx.fillRect(q.x - 18, q.y - 30, 36, 5);
      ctx.fillStyle = w > 0.7 ? '#ff7a6b' : '#ffd24d'; ctx.fillRect(q.x - 18, q.y - 30, 36 * (1 - Math.min(1, w)), 5);
      ctx.fillStyle = '#fff'; ctx.fillText(`${counts[dir]} wartend`, q.x, q.y - 34);
    }
    ctx.textAlign = 'start';
  }
}

function drawShip(ctx, cls, ship, p, game, ui) {
  const q = mapPx(p.x, p.y), L = cls.len * CELL, B = cls.beam * CELL * 0.78;
  ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(p.angle);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(1, 3, L / 2 + 2, B / 2 + 1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = cls.color; ctx.strokeStyle = '#10202c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-L / 2, -B / 2); ctx.lineTo(L / 2 - B * 0.6, -B / 2); ctx.lineTo(L / 2, 0); ctx.lineTo(L / 2 - B * 0.6, B / 2); ctx.lineTo(-L / 2, B / 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  const cargo = cargoById(ship.cargo);
  ctx.fillStyle = cargo?.color ?? '#999'; // Ladung
  if (cls.id === 'container') { for (let k = 0; k < 4; k++) for (let m = 0; m < 2; m++) { ctx.fillStyle = ['#e0803a', '#3a7ae0', '#d94a4a', '#e0c33a'][(k + m) % 4]; ctx.fillRect(-L / 2 + 4 + k * (L - B) / 4.4, -B / 2 + 3 + m * (B - 6) / 2, (L - B) / 4.6, (B - 6) / 2 - 1); } }
  else ctx.fillRect(-L / 2 + 4, -B / 2 + 3, L - B * 0.9 - 6, B - 6);
  ctx.fillStyle = '#f4f4f0'; ctx.fillRect(L / 2 - B * 0.95, -B * 0.28, B * 0.34, B * 0.56); // Brücke
  ctx.restore();
  if (ship.state === 'grounded') {
    ctx.font = font(18); ctx.textAlign = 'center'; ctx.fillStyle = (Math.floor((ui.t ?? 0) * 3) % 2) ? '#ff7a6b' : '#fff';
    ctx.fillText('⚠', q.x, q.y - 12); ctx.textAlign = 'start';
  }
}

function drawPontoon(ctx, game, sim, ui) {
  const r = game.river, px = OX + sim.x * CELL, py = sim.y * CELL;
  const B = CONFIG.box.cols;
  let c0, x0;
  if (sim.mode === 'slice') { c0 = sim.slice.c0; x0 = sim.slice.x0; }
  else { c0 = Math.min(Math.max(Math.round(sim.x) - Math.floor(B / 2), 0), r.cols - B); x0 = Math.min(Math.max(Math.round(sim.y) - SLICE.cols / 2, 0), r.rows - SLICE.cols); }
  const bx = OX + c0 * CELL, by = x0 * CELL, bw = B * CELL, bh = SLICE.cols * CELL; // der Kasten: 4 Spalten × 16 Zellen quer
  ctx.fillStyle = 'rgba(217,222,227,.16)'; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = sim.mode === 'slice' ? '#7fe3ff' : '#7fe3ff99'; ctx.lineWidth = 2; ctx.setLineDash(sim.mode === 'slice' ? [] : [6, 4]); ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2); ctx.setLineDash([]);
  if (sim.mode === 'slice') { // Position der Pumpe im Kasten
    const sy = by + (sim.slice.x - x0) * CELL;
    ctx.strokeStyle = sim.slice.suctioning ? '#ffd24d' : '#7fe3ffcc'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(bx - 3, sy); ctx.lineTo(bx + bw + 3, sy); ctx.stroke();
  }
  // Ponton (Boot mit Kran), quer zum Fluss gedreht
  ctx.save(); ctx.translate(px, py);
  ctx.fillStyle = '#e8c33a'; ctx.strokeStyle = '#3b2f08'; ctx.lineWidth = 1.5;
  ctx.fillRect(-CELL * 1.4, -CELL * 0.9, CELL * 2.8, CELL * 1.8); ctx.strokeRect(-CELL * 1.4, -CELL * 0.9, CELL * 2.8, CELL * 1.8);
  ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-CELL * 0.5, -CELL * 0.5, CELL, CELL);
  if (sim.mode === 'slice') { ctx.fillStyle = sim.pumpOn ? '#7bd88f' : '#ff7a6b'; ctx.beginPath(); ctx.arc(CELL * 0.9, -CELL * 0.5, 4, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  if (ui.mapTarget && sim.mode === 'map') {
    const t = mapPx(ui.mapTarget.x, ui.mapTarget.y);
    ctx.strokeStyle = '#7fe3ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(t.x, t.y, 10, 0, Math.PI * 2);
    ctx.moveTo(t.x - 14, t.y); ctx.lineTo(t.x + 14, t.y); ctx.moveTo(t.x, t.y - 14); ctx.lineTo(t.x, t.y + 14); ctx.stroke();
  }
}

function drawMapHud(ctx, game) {
  ctx.font = font(13);
  const lines = [];
  lines.push(`Pegel ${game.wl.toFixed(2)} m${game.wl > CONFIG.water.base + 0.25 ? ' ▲' : game.wl < CONFIG.water.base - 0.25 ? ' ▼' : ''}`);
  if (game.closed) lines.push('⛔ Hochwasser: Schifffahrt gesperrt');
  else if (game.time < (game.strikeUntil ?? 0)) lines.push('✊ Streik: kaum Verkehr');
  let y = 18;
  for (const t of lines) {
    const w = ctx.measureText(t).width + 14;
    ctx.fillStyle = '#000a'; ctx.fillRect(OX + 6, y - 14, w, fs(13) + 6);
    ctx.fillStyle = t.startsWith('⛔') ? '#ff9d8f' : '#fff'; ctx.fillText(t, OX + 13, y);
    y += fs(13) + 8;
  }
}

function turbidityVeil(ctx, sim) {
  if ((sim.turbidity ?? 0) > 0.02) { ctx.fillStyle = `rgba(140,110,70,${Math.min(0.55, sim.turbidity * 0.6)})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- Querschnitt ----------
function sliceHeadScreen(sl) {
  const wl = sl.wl;
  return { x: (sl.x - sl.x0) * U, y: sliceY(sl.h, wl) };
}
function sliceMouthScreen(sl) {
  const m = sl.mouth();
  return { x: (m.x - sl.x0) * U, y: sliceY(m.h, sl.wl) };
}
const sx = (sl, x) => (x - sl.x0) * U;

function drawSlice(ctx, game, sim, ui = {}) {
  const sl = sim.slice, r = game.river, wl = r.wl, n = SLICE.cols;
  const Y = (h) => sliceY(h, wl), xs = (c) => (c + 0.5) * U;
  // Himmel
  const sky = ctx.createLinearGradient(0, 0, 0, SURF);
  sky.addColorStop(0, '#6aa6d2'); sky.addColorStop(1, '#bcd9ee');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, SURF);
  // Wasser
  const wg = ctx.createLinearGradient(0, SURF, 0, H);
  wg.addColorStop(0, '#3a86ab'); wg.addColorStop(1, '#0d2c43');
  ctx.fillStyle = wg; ctx.fillRect(0, SURF, W, H - SURF);
  const hi = new Float32Array(n), cen = new Float32Array(n), lo = new Float32Array(n), rk = new Float32Array(n);
  for (let c = 0; c < n; c++) {
    hi[c] = sl.envTop(sl.x0 + c); lo[c] = sl.envLow(sl.x0 + c);
    rk[c] = r.rock[r.idx(sl.centerCol, sl.x0 + c)];
  }
  // Gelände: Profil als geschlossener Pfad (Hüllkurve = höchster Punkt über den Kasten); darin Sediment je Material und Fels
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, H);
  ctx.lineTo(0, Y(hi[0]));
  for (let c = 0; c < n; c++) ctx.lineTo(xs(c), Y(hi[c]));
  ctx.lineTo(W, Y(hi[n - 1])); ctx.lineTo(W, H); ctx.closePath(); ctx.clip();
  const kindColor = (c) => hexToRgb(CONFIG.materials[r.kind[r.idx(sl.centerCol, sl.x0 + Math.min(n - 1, Math.max(0, c)))]].color);
  for (let c = 0; c < n; c++) { // Sediment je Material, an den Zellgrenzen weich ineinander übergehend
    const g = ctx.createLinearGradient(c * U, 0, (c + 1) * U, 0), mid = kindColor(c);
    g.addColorStop(0, rgb(mix(kindColor(c - 1), mid, 0.5))); g.addColorStop(0.5, rgb(mid)); g.addColorStop(1, rgb(mix(mid, kindColor(c + 1), 0.5)));
    ctx.fillStyle = g; ctx.fillRect(c * U - (c ? 0 : 60), Y(hi[c]) - 2, U + 1 + (c ? 0 : 60) + (c === n - 1 ? 60 : 0), H);
  }
  for (let c = 0; c < n; c++) {
    const i = r.idx(sl.centerCol, sl.x0 + c), top = Y(hi[c]), bottom = Y(Math.min(hi[c], Math.max(r.rock[i], wl - 20)));
    if (r.hard[i] && r.top[i] - r.rock[i] > 0.05) { ctx.fillStyle = r.hard[i] > 1 ? 'rgba(25,18,10,.5)' : 'rgba(25,18,10,.28)'; ctx.fillRect(c * U, top, U, Math.max(0, bottom - top)); }
    if (r.kind[i] === KIND.altlast) { ctx.fillStyle = 'rgba(255,140,60,.35)'; ctx.fillRect(c * U, top, U, Math.max(0, bottom - top)); }
  }
  ctx.fillStyle = '#5d6168'; ctx.beginPath(); // Fels darunter als glatte Fläche
  ctx.moveTo(-10, H + 10); ctx.lineTo(-10, Y(rk[0]));
  for (let c = 0; c < n; c++) ctx.lineTo(xs(c), Y(Math.min(hi[c], rk[c])));
  ctx.lineTo(W + 10, Y(Math.min(hi[n - 1], rk[n - 1]))); ctx.lineTo(W + 10, H + 10); ctx.closePath(); ctx.fill();
  const dark = ctx.createLinearGradient(0, SURF, 0, H); dark.addColorStop(0, 'rgba(0,0,0,0)'); dark.addColorStop(1, 'rgba(0,0,0,.4)');
  ctx.fillStyle = dark; ctx.fillRect(0, SURF, W, H - SURF);
  ctx.restore();
  // Land über Wasser: grüne Grasnarbe
  for (let c = 0; c < n; c++) {
    if (hi[c] > wl) { ctx.fillStyle = '#6fa05a'; ctx.fillRect(c * U, Y(hi[c]) - 3, U + 1, 8); }
  }
  // Naturschutzzone (Ufer, Flachwasser): schraffiert
  for (let c = 0; c < n; c++) {
    const i = r.idx(sl.centerCol, sl.x0 + c);
    if (r.zone[i]) continue;
    const top = Math.max(SURF, Y(hi[c]));
    if (hi[c] >= wl) continue;
    ctx.fillStyle = 'rgba(120,220,120,.14)'; ctx.fillRect(c * U, SURF, U, top - SURF);
    ctx.save(); ctx.beginPath(); ctx.rect(c * U, SURF, U, top - SURF); ctx.clip();
    ctx.strokeStyle = 'rgba(160,255,160,.35)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let k = -(top - SURF); k < U; k += 12) { ctx.moveTo(c * U + k, SURF); ctx.lineTo(c * U + k + (top - SURF), top); }
    ctx.stroke(); ctx.restore();
  }
  // Profilkanten: dick = engste Stelle (höchster Punkt), dünn = tiefster Punkt im Kasten
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.beginPath();
  for (let c = 0; c < n; c++) (c ? ctx.lineTo(xs(c), Y(lo[c])) : ctx.moveTo(xs(c), Y(lo[c])));
  ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = '#f0e4c8'; ctx.lineWidth = 2.5; ctx.beginPath();
  for (let c = 0; c < n; c++) (c ? ctx.lineTo(xs(c), Y(hi[c])) : ctx.moveTo(xs(c), Y(hi[c])));
  ctx.stroke();
  // Wasserspiegel
  ctx.strokeStyle = '#d9f1ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, SURF); ctx.lineTo(W, SURF); ctx.stroke();

  // Klassen-Tiefenlinien (dünn) und Solltiefe (orange)
  ctx.font = font(12, false);
  ctx.textAlign = 'right';
  for (const cls of SHIPS) {
    if (!game.level.classes.includes(cls.id)) continue;
    const y = Y(wl - needDepth(cls)), on = ui.classSel === cls.id, ok = game.fair?.[cls.id]?.passable;
    ctx.strokeStyle = cls.color; ctx.globalAlpha = on ? 0.95 : 0.4; ctx.lineWidth = on ? 2 : 1; ctx.setLineDash([2, 6]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = on ? 1 : 0.75; ctx.fillStyle = '#000a'; const label = `${ok ? '✓ ' : ''}${cls.name} ${needDepth(cls).toFixed(1)} m`; const tw = ctx.measureText(label).width;
    ctx.fillRect(W - tw - 12, y - fs(12) + 1, tw + 8, fs(12) + 3); ctx.fillStyle = on ? '#fff' : cls.color; ctx.fillText(label, W - 6, y);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'start';
  const ty = Y(sl.targetTop());
  ctx.strokeStyle = '#ffae3d'; ctx.lineWidth = 2; ctx.setLineDash([10, 6]);
  ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(W, ty); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#ffae3d'; ctx.font = font(13); ctx.fillText(`Solltiefe ${sl.targetDepth.toFixed(1)} m`, 8, ty - 5);

  // Markierungen: wo liegt noch Sohle über der Solltiefe (rot, cm), wo steckt Fels
  ctx.textAlign = 'center';
  for (let c = 0; c < n; c++) {
    const i = r.idx(sl.centerCol, sl.x0 + c);
    if (!r.zone[i] || hi[c] >= wl) continue;
    const miss = hi[c] - sl.targetTop();
    if (miss > 0.03) {
      const x = xs(c), y = Y(hi[c]) - 6;
      ctx.fillStyle = '#ff5d4d'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 6, y - 10); ctx.lineTo(x + 6, y - 10); ctx.closePath(); ctx.fill();
      ctx.font = font(11); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000a'; ctx.lineWidth = 3; ctx.strokeText(`${Math.round(miss * 100)}`, x, y - 13); ctx.fillText(`${Math.round(miss * 100)}`, x, y - 13);
      if (rk[c] > sl.targetTop()) { ctx.fillStyle = '#c59aff'; ctx.fillText('Fels', x, y - 26); }
    }
  }
  ctx.textAlign = 'start';
  // Fremdstoffe
  for (let c = 0; c < n; c++) for (const col of sl.cols) {
    const i = r.idx(col, sl.x0 + c);
    if (r.debris[i] && r.isWater(i)) { ctx.fillStyle = '#f2f2f2'; ctx.beginPath(); ctx.arc(xs(c), Y(r.top[i]) - 6, 5, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#222'; ctx.stroke(); break; }
  }

  drawPump(ctx, game, sim, ui);
  turbidityVeil(ctx, sim);
  if (sl.freeing && sl.clog > 0) drawFreeing(ctx, sl);
  // Kopfzeile
  ctx.font = font(13); ctx.fillStyle = '#000a'; const head = `Pegel ${wl.toFixed(2)} m · Spalten ${sl.cols[0] + 1}–${sl.cols[sl.cols.length - 1] + 1}`;
  ctx.fillRect(6, 6, ctx.measureText(head).width + 14, fs(13) + 8); ctx.fillStyle = '#fff'; ctx.fillText(head, 13, 6 + fs(13) + 1);
}

function drawPump(ctx, game, sim, ui) {
  const sl = sim.slice, wl = game.river.wl;
